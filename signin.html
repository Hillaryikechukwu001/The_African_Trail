<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — The African Trail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
    }

    .page {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
      background: #fff;
    }

    /* ── LEFT: photo panel ── */
    .left {
      position: relative;
      overflow: hidden;
      min-height: 500px;
    }

    .left img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* ── RIGHT: form panel ── */
    .right {
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px 64px;
    }

    .page-title {
      text-align: center;
      font-size: 26px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
      line-height: 1.2;
    }

    .page-subtitle {
      text-align: center;
      font-size: 13px;
      font-weight: 400;
      color: #9e9e9e;
      margin-bottom: 28px;
    }

    .field-group {
      margin-bottom: 14px;
    }

    .field-label {
      display: block;
      font-size: 13px;
      font-weight: 400;
      color: #333333;
      margin-bottom: 5px;
    }

    .field-input {
      width: 100%;
      background: #ffffff;
      border: 1px solid #d9d9d9;
      border-radius: 6px;
      padding: 9px 13px;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }

    .field-input::placeholder {
      color: #bdbdbd;
      font-size: 13px;
      font-weight: 400;
    }

    .field-input:focus {
      border-color: #9e9e9e;
    }

    .options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 8px 0 20px;
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 400;
      color: #555555;
      cursor: pointer;
    }

    .remember-label input[type="checkbox"] {
      width: 12px;
      height: 12px;
      border-radius: 2px;
      cursor: pointer;
      flex-shrink: 0;
      accent-color: #3a5a2a;
    }

    .forgot-link {
      font-size: 12px;
      font-weight: 400;
      color: #3a5a2a;
      text-decoration: none;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .signin-btn {
      width: 100%;
      padding: 11px;
      background: #c1c5b2;
      border: none;
      border-radius: 6px;
      color: #0f0d0d;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: background 0.15s;
    }

    .signin-btn:hover {
      background: goldenrod;
    }

    .or-row {
      text-align: center;
      font-size: 12.5px;
      color: #9e9e9e;
      margin: 18px 0;
      font-weight: 400;
    }

    .social-row {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .social-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 10px;
      background: #ffffff;
      border: 1px solid #d9d9d9;
      border-radius: 6px;
      color: #000205;
      font-size: 12.5px;
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      white-space: nowrap;
    }

    .social-btn:hover {
      border-color: #bdbdbd;
      background: goldenrod;
    }

    .social-btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .signup-row {
      text-align: center;
      font-size: 13px;
      font-weight: 400;
      color: #555555;
    }

    .signup-row a {
      color: #3a5a2a;
      text-decoration: none;
      font-weight: 500;
      margin-left: 3px;
    }

    .signup-row a:hover {
      text-decoration: underline;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .page {
        grid-template-columns: 1fr;
      }
      .left {
        min-height: 260px;
        order: -1;
      }
      .right {
        padding: 40px 32px;
      }
    }

    @media (max-width: 480px) {
      .right {
        padding: 32px 24px;
      }
      .page-title {
        font-size: 22px;
      }
      .social-row {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

<div class="page">

  <!-- LEFT: plant photo — mirrors the signup right panel -->
  <div class="left">
    <img
      src="https://images.unsplash.com/photo-1545241047-6083a3684587?w=900&auto=format&fit=crop&q=80"
      alt="Monstera plant"
    />
  </div>

  <!-- RIGHT: sign in form -->
  <div class="right">

    <h1 class="page-title">Welcome Back</h1>
    <p class="page-subtitle">Sign in to continue Exploring</p>

    <div class="field-group">
      <label class="field-label" for="si-email">Email address</label>
      <input class="field-input" id="si-email" type="email" placeholder="Enter your email" />
    </div>

    <div class="field-group">
      <label class="field-label" for="si-pw">Password</label>
      <input class="field-input" id="si-pw" type="password" placeholder="Enter your password" />
    </div>

    <div class="options-row">
      <label class="remember-label">
        <input type="checkbox" id="si-remember" />
        Remember me
      </label>
      <a class="forgot-link" href="#">Forgot password?</a>
    </div>

    <button class="signin-btn" type="button">Sign In</button>

    <div class="or-row">or</div>

    <div class="social-row">
      <button class="social-btn" type="button">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Sign in with Google
      </button>
      <button class="social-btn" type="button">
        <svg viewBox="0 0 814 1000" xmlns="http://www.w3.org/2000/svg" fill="#1a1a1a">
          <path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-37.3-148.2-97.6C27.5 768.3 0 682.3 0 600.6c0-154.3 100.6-236.1 199.6-236.1 73.4 0 127.5 47.6 171.3 47.6 42.1 0 103.7-50.2 185.4-50.2zm-339.5-136.8c31.1-36.9 53.1-88.1 53.1-139.3 0-7.1-.6-14.3-1.9-20.1-50.6 1.9-110.8 33.7-147.1 75.8-28.5 32.4-55.1 83.6-55.1 135.5 0 7.8 1.3 15.6 1.9 18.1 3.2.6 8.4 1.3 13.6 1.3 45.4 0 102.5-30.4 135.5-71.3z"/>
        </svg>
        Sign in with Apple
      </button>
    </div>

    <div class="signup-row">
      Don't have an account? <a href="signup.html">Sign Up</a>
    </div>

  </div>
</div>

</body>
</html>
