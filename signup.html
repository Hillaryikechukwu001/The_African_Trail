<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get Started — The African Trail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
    }

    .page {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
      background: #e4d8a7;
    }

    /* ── LEFT PANEL ── */
    .left {
      background: #e4d8a7;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px 64px;
    }

    .title__logo {
    text-align: center;
    display: inline-block;
    font-family: 'Playfair Display', serif;
    font-size: 42px;
    font-weight: 700;
    color: black;
    letter-spacing: 0.3px;
    text-decoration: none;
    margin-bottom: 32px;
    flex-shrink: 0;
    }
    .title__logo span { color: #C8922A; }

    .field-group {
      margin-bottom: 14px;
    }

    .field-label {
      display: block;
      font-size: 13px;
      font-weight: 400;
      color: #0b0a0a;
      margin-bottom: 5px;
    }

    .field-input {
      width: 100%;
      background: #ffffff;
      border: 1px solid #d9d9d9;
      border-radius: 6px;
      padding: 9px 13px;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }

    .field-input::placeholder {
      color: #bdbdbd;
      font-size: 13px;
      font-weight: 400;
    }

    .field-input:focus {
      border-color: #9e9e9e;
    }

    .terms-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 8px 0 20px;
    }

    .terms-row input[type="checkbox"] {
      width: 12px;
      height: 12px;
      border-radius: 2px;
      cursor: pointer;
      flex-shrink: 0;
      accent-color: #3a5a2a;
    }

    .terms-row label {
      font-size: 12px;
      font-weight: 400;
      color: #040303fd;
      cursor: pointer;
    }

    .terms-row a {
      color: #0e0c0c;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .signup-btn {
      width: 100%;
      padding: 11px;
      background: #f2da98;
      border: none;
      border-radius: 6px;
      color: #090808;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: background 0.15s;
    }

    .signup-btn:hover {
      background: goldenrod;
    }

    .or-row {
      text-align: center;
      font-size: 12.5px;
      color: #9e9e9e;
      margin: 18px 0;
      font-weight: 400;
    }

    .social-row {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .social-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 10px;
      background: #ffffff;
      border: 1px solid #d9d9d9;
      border-radius: 6px;
      color: #1a1a1a;
      font-size: 12.5px;
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      white-space: nowrap;
    }

    .social-btn:hover {
      border-color: #bdbdbd;
      background: goldenrod;
    }

    .social-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

    .signin-row {
      text-align: center;
      font-size: 13px;
      font-weight: 400;
      color: #555555;
    }

    .signin-row a {
      color: #050605;
      text-decoration: none;
      font-weight: 500;
      margin-left: 3px;
    }

    .signin-row a:hover { text-decoration: underline; }

    /* ── RIGHT PANEL ── */
    .right {
      position: relative;
      overflow: hidden;
      min-height: 500px;
    }

    .right img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .page { grid-template-columns: 1fr; }
      .right { min-height: 260px; order: -1; }
      .left { padding: 40px 32px; }
    }

    @media (max-width: 480px) {
      .left { padding: 32px 24px; }
      .page-title { font-size: 22px; }
      .social-row { flex-direction: column; }
    }
  </style>
</head>
<body>

<div class="page">

  <!-- LEFT: form -->
  <div class="left">
   <a href="index.html" class="title__logo">The African <span>Trail</span></a>

<form id="signup-form">

  <div class="field-group">
    <label class="field-label" for="f-name">Name</label>
    <input class="field-input" id="f-name" type="text" placeholder="Enter your name" />
  </div>

  <div class="field-group">
    <label class="field-label" for="f-email">Email address</label>
    <input class="field-input" id="f-email" type="email" placeholder="Enter your email" />
  </div>

  <div class="field-group">
    <label class="field-label" for="f-pw">Password</label>
    <input class="field-input" id="f-pw" type="password" placeholder="Enter your password" />
  </div>

  <div class="terms-row">
    <input type="checkbox" id="f-terms" />
    <label for="f-terms">I agree to the <a href="#">terms &amp; policy</a></label>
  </div>

  <button class="signup-btn" type="submit">Sign Up</button>

</form>

    <div class="or-row">or</div>

    <div class="social-row">
      <button class="social-btn" type="button">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Sign in with Google
      </button>
      <button class="social-btn" type="button">
        <svg viewBox="0 0 814 1000" xmlns="http://www.w3.org/2000/svg" fill="#1a1a1a">
          <path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-37.3-148.2-97.6C27.5 768.3 0 682.3 0 600.6c0-154.3 100.6-236.1 199.6-236.1 73.4 0 127.5 47.6 171.3 47.6 42.1 0 103.7-50.2 185.4-50.2zm-339.5-136.8c31.1-36.9 53.1-88.1 53.1-139.3 0-7.1-.6-14.3-1.9-20.1-50.6 1.9-110.8 33.7-147.1 75.8-28.5 32.4-55.1 83.6-55.1 135.5 0 7.8 1.3 15.6 1.9 18.1 3.2.6 8.4 1.3 13.6 1.3 45.4 0 102.5-30.4 135.5-71.3z"/>
        </svg>
        Sign in with Apple
      </button>
    </div>

    <div class="signin-row">
      Already have an account? <a href="signin.html">Sign In</a>
    </div>
  </div>

  <!-- RIGHT: full-height plant photo, no overlay, no text -->
  <div class="right">
    <img
      src="img 6.jpg"
      alt="egytpt musuem"
    />
  </div>

</div>
<script>
  document.getElementById('signup-form').addEventListener('submit', function (e) {
    e.preventDefault();

    // Mock: save user as logged in
    localStorage.setItem('tat_user', 'true');

    // After signup, send them to the intended destination or homepage
    const redirect = localStorage.getItem('tat_redirect') || 'index.html#destinations';
    localStorage.removeItem('tat_redirect');
    window.location.href = redirect;
  });
</script>


</body>
</html>
